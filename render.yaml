databases:
  - name: clinipet-db
    plan: free
    databaseName: clinipet
    user: clinipet

services:
  - type: web
    name: clinipet-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /docs
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DB_HOST
        fromDatabase:
          name: clinipet-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: clinipet-db
          property: port
      - key: DB_USERNAME
        fromDatabase:
          name: clinipet-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: clinipet-db
          property: password
      - key: DB_DATABASE
        fromDatabase:
          name: clinipet-db
          property: database
      - key: DOG_API_KEY
        sync: false
      - key: CAT_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: TELEGRAM_LINKING_SECRET
        sync: false
